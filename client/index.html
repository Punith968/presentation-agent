<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Presentation Agent</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>AI Presentation Agent</h1>
    </header>
    
    <main class="panels two-col">
      <section class="panel left-panel">
        <div class="upload-area" id="uploadArea">
          <div class="upload-content">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p>Drag & drop PDF or PPTX here</p>
            <span class="or">or</span>
            <button class="browse-btn" onclick="document.getElementById('fileInput').click()">Browse Files</button>
            <input type="file" id="fileInput" accept=".pdf,.pptx" hidden>
          </div>
        </div>
        <div class="slide-list" id="slideList">
          <h3>Slides</h3>
          <ul id="slideListItems"></ul>
        </div>
      </section>

      <section class="panel center-panel">
        <div class="slide-viewer">
          <div class="slide-top-bar">
            <div class="slide-counter" id="slideCounter">Slide 0 of 0</div>
            <div class="slide-size-controls">
              <button class="size-btn active" id="btnFit" onclick="setSlideMode('fit')">⊡ Fit</button>
              <button class="size-btn" id="btnFill" onclick="setSlideMode('fill')">⛶ Fill</button>
              <button class="size-btn" onclick="toggleFullScreen()">⛶ Full Screen</button>
              <div class="zoom-control">
                <button class="size-btn" onclick="adjustZoom(-10)">−</button>
                <span id="zoomLabel">100%</span>
                <button class="size-btn" onclick="adjustZoom(10)">+</button>
              </div>
            </div>
          </div>
          <div class="slide-content" id="slideContent">
            <p class="placeholder">Upload a presentation to get started</p>
          </div>
        </div>
        <div class="controls">
          <button class="control-btn" id="prevBtn" disabled>◀ Prev</button>
          <button class="control-btn primary" id="playBtn" disabled>▶ Play Narration</button>
          <button class="control-btn" id="stopBtn" disabled>⏹ Stop</button>
          <button class="control-btn" id="nextBtn" disabled>Next ▶</button>
        </div>
        <div class="auto-advance">
          <label>
            <input type="checkbox" id="autoAdvance" checked>
            Auto-advance to next slide
          </label>
        </div>
        <button class="qa-toggle-btn" id="qaToggleBtn" onclick="toggleQAPanel()">
          💬 Q&A
        </button>
      </section>
    </main>
    <div class="qa-overlay" id="qaOverlay">
      <div class="qa-panel-floating">
        <div class="qa-panel-header">
          <h3>Q&A Session</h3>
          <button class="qa-close-btn" onclick="toggleQAPanel()">✕</button>
        </div>
        <div class="qa-messages" id="qaMessages"></div>
        <div class="qa-input">
          <button class="mic-btn" id="micBtn" title="Voice Input">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" 
                 stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          <input type="text" id="questionInput" placeholder="Ask a question..." disabled>
          <button class="send-btn" id="sendBtn" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
